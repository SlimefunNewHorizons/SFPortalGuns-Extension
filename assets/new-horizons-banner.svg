<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Slimefun: New Horizons — Modernizing Slimefun for the next generation of Minecraft">
  <defs>
    <!-- Celestial laboratory background (organization star model) -->
    <linearGradient id="void" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="28%" stop-color="#0a1230"/>
      <stop offset="58%" stop-color="#0b1f2a"/>
      <stop offset="88%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <radialGradient id="nebViolet" cx="22%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebCyan" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#10B981" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebGold" cx="50%" cy="34%" r="30%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C7D2FE"/>
      <stop offset="30%" stop-color="#67E8F9"/>
      <stop offset="62%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FBBF24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="50%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <pattern id="hex" width="40" height="69.282" patternUnits="userSpaceOnUse" patternTransform="scale(0.85)">
      <path d="M 40 0 L 20 11.547 L 0 0 L 0 23.094 L 20 34.641 L 40 23.094 Z M 0 34.641 L 20 46.188 L 40 34.641 L 40 57.735 L 20 69.282 L 0 57.735 Z"
            fill="none" stroke="#67E8F9" stroke-width="0.75" stroke-opacity="0.055"/>
      <circle cx="20" cy="34.641" r="1" fill="#A5B4FC" fill-opacity="0.2"/>
    </pattern>

    <!-- Emblem parts (same artwork as the logo) -->
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C7D2FE"/><stop offset="55%" stop-color="#A5B4FC"/><stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="interior" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06301c"/><stop offset="60%" stop-color="#0a4a2a"/><stop offset="100%" stop-color="#0d5b38"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7"/><stop offset="35%" stop-color="#FBBF24" stop-opacity="0.85"/><stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399"/><stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D9F99D"/><stop offset="45%" stop-color="#84CC16"/><stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <pattern id="scan" width="6" height="4" patternUnits="userSpaceOnUse"><rect width="6" height="1.6" fill="#000" fill-opacity="0.28"/></pattern>
    <clipPath id="innerClip"><rect x="122" y="122" width="268" height="268" rx="30"/></clipPath>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b1"/><feGaussianBlur stdDeviation="16" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      @keyframes conduit { to { stroke-dashoffset: -180; } }
      @keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
      @keyframes shimmer { 0%,100% { stroke-opacity: .5; } 50% { stroke-opacity: 1; } }
      @keyframes titlePulse { 0%,100% { opacity: .92; filter: drop-shadow(0 0 10px rgba(103,232,249,.55)); } 50% { opacity: 1; filter: drop-shadow(0 0 22px rgba(251,191,36,.85)); } }
      .conduit { stroke-dasharray: 12 16; animation: conduit 14s linear infinite; }
      .tw { animation: twinkle 3.2s ease-in-out infinite; }
      .border { animation: shimmer 4s ease-in-out infinite; }
      .title { font-family: 'Outfit','Segoe UI',sans-serif; font-weight: 900; font-size: 56px; fill: url(#titleGrad); animation: titlePulse 3.5s ease-in-out infinite; }
      .tag { font-family: 'Inter','Segoe UI',sans-serif; font-weight: 700; font-size: 15px; fill: #94A3B8; letter-spacing: 3.2px; }
      .chip { font-family: 'JetBrains Mono',monospace; font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="440" rx="24" fill="url(#void)"/>
  <rect width="1200" height="440" rx="24" fill="url(#hex)"/>
  <rect width="1200" height="440" rx="24" fill="url(#nebViolet)"/>
  <circle cx="600" cy="150" r="330" fill="url(#nebCyan)"/>
  <circle cx="600" cy="135" r="190" fill="url(#nebGold)"/>

  <!-- Conduits -->
  <g class="conduit" opacity="0.35" fill="none" stroke-width="1.6">
    <path d="M 60 80 L 380 80 L 470 150 M 1140 80 L 820 80 L 730 150" stroke="#A5B4FC"/>
    <path d="M 60 400 L 380 400 L 470 230 M 1140 400 L 820 400 L 730 230" stroke="#67E8F9"/>
  </g>

  <!-- Stars -->
  <g fill="#FDE68A">
    <circle class="tw" cx="170" cy="112" r="2"/>
    <circle class="tw" cx="1030" cy="132" r="2.4" style="animation-delay:1.1s"/>
    <circle class="tw" cx="244" cy="318" r="1.8" style="animation-delay:.6s"/>
    <circle class="tw" cx="968" cy="296" r="2" style="animation-delay:1.8s"/>
    <circle class="tw" cx="112" cy="226" r="1.6" style="animation-delay:2.3s"/>
    <circle class="tw" cx="1090" cy="236" r="1.6" style="animation-delay:.3s"/>
  </g>

  <!-- Rings around the emblem (SMIL: robust inside <img> on GitHub) -->
  <g transform="translate(600 150)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="44s" repeatCount="indefinite"/>
      <circle r="124" fill="none" stroke="url(#ringGrad)" stroke-width="1.8" stroke-dasharray="16 12" opacity="0.7"/>
      <circle cx="124" cy="0" r="4.5" fill="#FBBF24" filter="url(#glow)"/>
      <circle cx="-124" cy="0" r="4.5" fill="#67E8F9" filter="url(#glow)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite"/>
      <polygon points="0,-96 83,-48 83,48 0,96 -83,48 -83,-48" fill="none" stroke="#A5B4FC" stroke-width="1.2" stroke-dasharray="8 6" opacity="0.5"/>
      <circle cx="83" cy="-48" r="3.5" fill="#FEF3C7" filter="url(#glow)"/>
    </g>
  </g>

  <!-- Emblem (logo core, scaled) centered at (600,150) -->
  <g transform="translate(600 150) scale(0.5) translate(-256 -256)">
    <g filter="url(#wobble)"><rect x="96" y="96" width="320" height="320" rx="52" fill="url(#shell)"/></g>
    <rect x="122" y="122" width="268" height="268" rx="30" fill="url(#interior)"/>
    <g clip-path="url(#innerClip)">
      <circle cx="256" cy="366" r="150" fill="url(#sun)">
        <animate attributeName="cy" values="378;346;378" dur="9s" repeatCount="indefinite"/>
      </circle>
      <path d="M 100 366 Q 256 316 412 366 L 412 400 L 100 400 Z" fill="url(#land)"/>
      <path d="M 100 366 Q 256 316 412 366" fill="none" stroke="#FDE68A" stroke-width="3.6" opacity="0.95" filter="url(#glow)"/>
      <rect x="122" y="122" width="268" height="268" fill="url(#scan)"/>
    </g>
    <g transform="translate(206 226)"><g>
      <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 0.12;1 1;1 1" keyTimes="0;0.9;0.94;0.98;1" dur="6s" repeatCount="indefinite"/>
      <polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="url(#eye)" filter="url(#glow)"/>
      <polygon points="-6,-30 18,-17 18,-9 -6,-22" fill="#F7FEE7" opacity="0.55"/></g></g>
    <g transform="translate(306 226)"><g>
      <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 0.12;1 1;1 1" keyTimes="0;0.9;0.94;0.98;1" dur="6s" repeatCount="indefinite"/>
      <polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="url(#eye)" filter="url(#glow)"/>
      <polygon points="-6,-30 18,-17 18,-9 -6,-22" fill="#F7FEE7" opacity="0.55"/></g></g>
    <g transform="translate(420 100)" filter="url(#glow)">
      <path d="M 0 -30 L 6 -6 L 30 0 L 6 6 L 0 30 L -6 6 L -30 0 L -6 -6 Z" fill="#FEF3C7">
        <animateTransform attributeName="transform" type="rotate" values="0;90" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Text -->
  <text x="600" y="326" text-anchor="middle" class="title" filter="url(#bigGlow)">SLIMEFUN: NEW HORIZONS</text>
  <text x="600" y="358" text-anchor="middle" class="tag">MODERNIZING SLIMEFUN FOR THE NEXT GENERATION OF MINECRAFT</text>

  <!-- Chips -->
  <g transform="translate(600 398)">
    <rect x="-364" y="-15" width="170" height="30" rx="6" fill="#0F172A" stroke="#67E8F9" stroke-width="1.5"/>
    <text x="-279" y="5" text-anchor="middle" class="chip" fill="#67E8F9">PAPER 1.21 · 26.x</text>
    <rect x="-178" y="-15" width="170" height="30" rx="6" fill="#0F172A" stroke="#A5B4FC" stroke-width="1.5"/>
    <text x="-93" y="5" text-anchor="middle" class="chip" fill="#A5B4FC">STARSUITES</text>
    <rect x="8" y="-15" width="170" height="30" rx="6" fill="#0F172A" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="93" y="5" text-anchor="middle" class="chip" fill="#FBBF24">RUST-ACCELERATED</text>
    <rect x="194" y="-15" width="170" height="30" rx="6" fill="#0F172A" stroke="#84CC16" stroke-width="1.5"/>
    <text x="279" y="5" text-anchor="middle" class="chip" fill="#84CC16">OPEN SOURCE</text>
  </g>

  <rect class="border" x="3" y="3" width="1194" height="434" rx="22" fill="none" stroke="url(#cyberBorder)" stroke-width="2"/>
</svg>
