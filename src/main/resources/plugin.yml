main: ru.officialdakari.portalgunsf.PortalGunPlugin
name: SFPortalGunsExtension
version: 1.1.0
author: SlimefunNewHorizons
depend: [Slimefun]
api-version: '1.21'
permissions:
  sfportalguns.infinite:
    description: Enables the unlimited Portal Gun mode.
    default: op
commands:
  portalguns:
    description: Names or recolors the Portal Gun you hold.
    aliases: [pg]
    usage: /pg <name|color> <value>
